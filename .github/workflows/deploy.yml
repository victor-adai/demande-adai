name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: "file:./ci.db"
          NEXTAUTH_SECRET: "ci-build-only-secret"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: "file:./ci.db"
          NEXTAUTH_SECRET: "ci-build-only-secret"
          NEXTAUTH_URL: "http://localhost:3000"

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # The deploy key's authorized_keys entry on the VPS is a forced command
      # (`command="bash /home/adai/deploy.sh"`, restricted to that script only).
      # It must NOT also carry `no-pty`: appleboy/ssh-action requests a PTY for
      # streaming output, and the server rejecting that request fails the step
      # almost immediately (~30-40s) — well before the real script could run.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /home/adai/deploy.sh
